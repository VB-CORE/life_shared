name: life_shared
description: A new Flutter package project.
version: 0.0.1
homepage: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # firebase_ui_firestore 2.1.0 caps intl at 0.20.2.
  intl: ^0.20.2
  flutter_image_compress: ^2.5.1
  json_annotation: ^4.12.0
  equatable: ^2.1.0
  image_picker: ^1.2.3
  image_cropper: ^11.0.0

  #firebase
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_ui_firestore: ^2.1.0

  # Util
  logger: ^2.7.0
  kartal: ^4.2.0
  uuid: ^4.6.0
  collection: ^1.19.1

  # UI
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  # 2.16.0 needs analyzer >=13.3.0 -> meta ^1.18.3, but Flutter 3.44.9 pins
  # meta 1.18.0 via flutter_test. Raise once the SDK ships a newer meta.
  build_runner: ^2.15.1
  very_good_analysis: ^10.0.0
  # Same meta 1.18.0 ceiling as build_runner above.
  mockito: ^5.7.0
